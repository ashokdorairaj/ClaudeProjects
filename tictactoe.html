<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #e94560;
    }

    #status {
      font-size: 1.2rem;
      height: 1.5em;
      color: #a8dadc;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.05);
    }

    .cell.x { color: #e94560; }
    .cell.o { color: #a8dadc; }

    .cell.win {
      background: #0f3460;
      animation: pulse 0.5s ease-in-out;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    #controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:hover { background: #c73652; transform: scale(1.04); }

    #mode-toggle {
      background: #0f3460;
      font-size: 0.9rem;
      padding: 10px 16px;
    }
    #mode-toggle:hover { background: #16427a; }

    #score {
      display: flex;
      gap: 32px;
      font-size: 1rem;
      color: #888;
    }

    .score-item span {
      font-size: 1.4rem;
      font-weight: bold;
      display: block;
      text-align: center;
    }

    .score-item.x-score span { color: #e94560; }
    .score-item.o-score span { color: #a8dadc; }
    .score-item.tie-score span { color: #f4a261; }
  </style>
</head>
<body>

<h1>Tic Tac Toe</h1>

<div id="score">
  <div class="score-item x-score">X <span id="score-x">0</span></div>
  <div class="score-item tie-score">Ties <span id="score-tie">0</span></div>
  <div class="score-item o-score">O <span id="score-o">0</span></div>
</div>

<div id="status">X's turn</div>

<div id="board">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
  <div class="cell" data-i="4"></div>
  <div class="cell" data-i="5"></div>
  <div class="cell" data-i="6"></div>
  <div class="cell" data-i="7"></div>
  <div class="cell" data-i="8"></div>
</div>

<div id="controls">
  <button id="restart">New Game</button>
  <button id="mode-toggle">vs CPU</button>
</div>

<script>
  const cells = document.querySelectorAll('.cell');
  const statusEl = document.getElementById('status');
  const restartBtn = document.getElementById('restart');
  const modeBtn = document.getElementById('mode-toggle');
  const scoreX = document.getElementById('score-x');
  const scoreO = document.getElementById('score-o');
  const scoreTie = document.getElementById('score-tie');

  const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  let board, current, gameOver, vsCPU;
  let scores = { X: 0, O: 0, T: 0 };

  function init() {
    board = Array(9).fill('');
    current = 'X';
    gameOver = false;
    cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
    statusEl.textContent = `${current}'s turn`;
  }

  function checkWin(b, p) {
    return WINS.find(line => line.every(i => b[i] === p)) || null;
  }

  function checkTie(b) { return b.every(v => v !== ''); }

  function handleClick(i) {
    if (gameOver || board[i]) return;
    if (vsCPU && current === 'O') return;
    place(i);
    if (vsCPU && !gameOver) {
      setTimeout(cpuMove, 300);
    }
  }

  function place(i) {
    board[i] = current;
    const cell = cells[i];
    cell.textContent = current;
    cell.classList.add('taken', current.toLowerCase());

    const win = checkWin(board, current);
    if (win) {
      win.forEach(j => cells[j].classList.add('win'));
      statusEl.textContent = `${current} wins!`;
      scores[current]++;
      updateScore();
      gameOver = true;
    } else if (checkTie(board)) {
      statusEl.textContent = "It's a tie!";
      scores.T++;
      updateScore();
      gameOver = true;
    } else {
      current = current === 'X' ? 'O' : 'X';
      statusEl.textContent = `${current}'s turn${vsCPU && current === 'O' ? ' (CPU)' : ''}`;
    }
  }

  function updateScore() {
    scoreX.textContent = scores.X;
    scoreO.textContent = scores.O;
    scoreTie.textContent = scores.T;
  }

  function cpuMove() {
    if (gameOver) return;
    const move = bestMove(board);
    place(move);
  }

  function minimax(b, depth, isMax) {
    if (checkWin(b, 'O')) return 10 - depth;
    if (checkWin(b, 'X')) return depth - 10;
    if (checkTie(b)) return 0;

    if (isMax) {
      let best = -Infinity;
      for (let i = 0; i < 9; i++) {
        if (!b[i]) {
          b[i] = 'O';
          best = Math.max(best, minimax(b, depth + 1, false));
          b[i] = '';
        }
      }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++) {
        if (!b[i]) {
          b[i] = 'X';
          best = Math.min(best, minimax(b, depth + 1, true));
          b[i] = '';
        }
      }
      return best;
    }
  }

  function bestMove(b) {
    let bestScore = -Infinity, move = -1;
    for (let i = 0; i < 9; i++) {
      if (!b[i]) {
        b[i] = 'O';
        const score = minimax(b, 0, false);
        b[i] = '';
        if (score > bestScore) { bestScore = score; move = i; }
      }
    }
    return move;
  }

  cells.forEach(cell => cell.addEventListener('click', () => handleClick(+cell.dataset.i)));

  restartBtn.addEventListener('click', init);

  modeBtn.addEventListener('click', () => {
    vsCPU = !vsCPU;
    modeBtn.textContent = vsCPU ? 'vs Human' : 'vs CPU';
    scores = { X: 0, O: 0, T: 0 };
    updateScore();
    init();
  });

  vsCPU = false;
  init();
</script>
</body>
</html>
